name: iOS pull request

on:
  pull_request:
  push:
    branches: [main, iphone]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip LiteRT-LM Git LFS smudging
        run: git lfs install --skip-smudge
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iPhoneLocalAI.xcodeproj -scheme iPhoneLocalAI
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint Swift sources
        run: swiftlint lint --quiet
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -project iPhoneLocalAI.xcodeproj
          -scheme iPhoneLocalAI
          -destination 'generic/platform=iOS Simulator'
          -arch arm64
          CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: >-
          xcodebuild -project iPhoneLocalAI.xcodeproj
          -scheme iPhoneLocalAI
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -arch arm64
          CODE_SIGNING_ALLOWED=NO test
