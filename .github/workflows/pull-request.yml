name: iOS pull request

# macOS runner minutes are billed at a much higher rate than Linux minutes, so
# this workflow runs only for pull requests (or on demand), lints on Linux
# first, and runs the Simulator build and tests in a single macOS step.

on:
  pull_request:
    paths-ignore: ['**.md', 'scripts/iphone/**', 'test.png']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint Swift sources
        run: swiftlint lint --quiet

  test:
    needs: lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Skip LiteRT-LM Git LFS smudging
        run: git lfs install --skip-smudge
      - name: Build and run unit tests on iOS Simulator
        run: >-
          xcodebuild -project iPhoneLocalAI.xcodeproj
          -scheme iPhoneLocalAI
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          GIT_COMMIT_SHA="$GITHUB_SHA"
          EXCLUDED_ARCHS=x86_64
          CODE_SIGNING_ALLOWED=NO test
