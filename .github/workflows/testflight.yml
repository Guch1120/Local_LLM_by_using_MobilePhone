name: TestFlight

# Distribution build for App Store Connect / TestFlight. Start manually:
#   gh workflow run testflight.yml --ref iphone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: jp.localai.iphone-server
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Skip LiteRT-LM Git LFS smudging
        run: git lfs install --skip-smudge

      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          : "${APPSTORE_ISSUER_ID:?Add the APPSTORE_ISSUER_ID repository secret}"
          : "${APPSTORE_API_KEY_ID:?Add the APPSTORE_API_KEY_ID repository secret}"
          : "${APPSTORE_API_PRIVATE_KEY:?Add the APPSTORE_API_PRIVATE_KEY repository secret}"
          : "${APPLE_TEAM_ID:?Add the APPLE_TEAM_ID repository secret}"

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPSTORE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iPhoneLocalAI.xcodeproj -scheme iPhoneLocalAI

      - name: Run unit tests
        run: >-
          xcodebuild -project iPhoneLocalAI.xcodeproj
          -scheme iPhoneLocalAI
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          EXCLUDED_ARCHS=x86_64
          CODE_SIGNING_ALLOWED=NO test

      - name: Archive unsigned for App Store export
        run: >-
          xcodebuild -project iPhoneLocalAI.xcodeproj
          -scheme iPhoneLocalAI
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/iPhoneLocalAI.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          GIT_COMMIT_SHA="$GITHUB_SHA"
          archive

      - name: Verify embedded frameworks are loadable
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/iPhoneLocalAI.xcarchive/Products/Applications/iPhoneLocalAI.app"
          test -f "$APP/Frameworks/CLiteRTLM.framework/CLiteRTLM" || { echo "CLiteRTLM.framework is not embedded"; exit 1; }
          otool -l "$APP/iPhoneLocalAI" | grep -A2 LC_RPATH | grep -q '@executable_path/Frameworks' || { echo "Missing @executable_path/Frameworks rpath"; exit 1; }

      - name: Export and upload with cloud-managed signing
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>__TEAM_ID__</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' "s/__TEAM_ID__/$APPLE_TEAM_ID/g" "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iPhoneLocalAI.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPSTORE_API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
